# The repo's own check, next to the rig catalog's secret-scan.yml. Runs on the Forgejo runners
# for every pull request and on pushes to main (a PR branch is covered by its pull_request run).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Tests (no dependencies to install)
        run: bun test
